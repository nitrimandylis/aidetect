[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aidetect"
version = "0.4.0"
description = "Local, offline AI-writing detector and IB word counter for your own drafts"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Nikolas Trimandylis" }]
keywords = ["ai-detection", "binoculars", "ib", "word-count", "docx"]
classifiers = [
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = [
  "torch",
  "transformers",
  "python-docx",
  # Apple Silicon only: enables the 4-bit Gemma 4 pair, the one that actually
  # separates human from AI text. Gemma 4 is a VLM checkpoint, hence mlx-vlm.
  "mlx-vlm; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.urls]
Homepage = "https://github.com/nitrimandylis/aidetect"
Source = "https://github.com/nitrimandylis/aidetect"

[project.scripts]
aidetect = "aidetect.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aidetect"]

[tool.hatch.build.targets.sdist]
# corpora/ is short excerpts from 48 real students' Extended Essays plus LLM
# imitations, and the *-clean.txt files are my own drafts. Repo-only.
#
# tests/ is excluded for the same reason, not for tidiness: tests/fixtures/
# holds 24 of those same excerpts, so shipping the tests would redistribute
# exactly the material corpora/ is withheld to avoid redistributing.
#
# tools/ is the corpus-building pipeline. It is macOS-only (Vision, swiftc) and
# nothing in the package imports it, so it is dead weight in a wheel.
exclude = ["corpora", "tests", "tools", "*-clean.txt", "fast-ai-detector"]
